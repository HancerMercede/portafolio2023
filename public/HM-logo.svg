<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020b1a" />
      <stop offset="100%" style="stop-color:#061428" />
    </linearGradient>
    <!-- Mostly blue, just a hint of violet at the end -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e0ff" />
      <stop offset="60%" style="stop-color:#0088ff" />
      <stop offset="100%" style="stop-color:#5533ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="accentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e0ff" />
      <stop offset="100%" style="stop-color:#0066ff" />
    </linearGradient>
    <linearGradient id="accentRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066ff" />
      <stop offset="100%" style="stop-color:#5533ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGrad)" rx="18" />

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#0088ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
  </g>

  <!-- Glow orb behind text -->
  <ellipse cx="100" cy="105" rx="75" ry="45" fill="#0055ff" opacity="0.08"/>

  <!-- Corner brackets -->
  <polyline points="14,30 14,14 30,14" fill="none" stroke="url(#accentLeft)" stroke-width="2.5" stroke-linecap="round" filter="url(#softglow)"/>
  <polyline points="170,14 186,14 186,30" fill="none" stroke="url(#accentRight)" stroke-width="2.5" stroke-linecap="round" filter="url(#softglow)"/>
  <polyline points="14,170 14,186 30,186" fill="none" stroke="url(#accentLeft)" stroke-width="2.5" stroke-linecap="round" filter="url(#softglow)"/>
  <polyline points="170,186 186,186 186,170" fill="none" stroke="url(#accentRight)" stroke-width="2.5" stroke-linecap="round" filter="url(#softglow)"/>

  <!-- HM bold text -->
  <text
    x="100"
    y="125"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="88"
    font-weight="900"
    letter-spacing="-2"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >HM</text>

  <!-- Bottom accent line -->
  <rect x="30" y="146" width="140" height="2.5" fill="url(#accentLeft)" rx="2" opacity="0.9" filter="url(#softglow)"/>

  <!-- Dot accents -->
  <circle cx="26" cy="147.5" r="3" fill="#00e0ff" opacity="0.95" filter="url(#softglow)"/>
  <circle cx="174" cy="147.5" r="3" fill="#5533ff" opacity="0.95" filter="url(#softglow)"/>
</svg>
